<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Shirt Studio</title>
<style>
:root{--bg:#111217;--panel:#1b1c22;--panel2:#17181d;--line:#2a2c34;--text:#f5f5f7;--muted:#9599a6;--blue:#2f68ff;--danger:#ef3a4a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden}button,input{font:inherit}button{color:inherit}
.app{height:100dvh;max-height:100dvh;display:grid;grid-template-rows:auto auto minmax(0,1fr);background:var(--bg);overflow:hidden}
.topbar{height:78px;display:grid;grid-template-columns:80px 1fr 92px;align-items:center;padding:0 16px;border-bottom:1px solid #050507;background:#18191f;z-index:20}.brand{font-weight:900;font-size:31px;font-style:italic;letter-spacing:-2px;text-align:center}.pill{height:50px;border:1px solid #090a0e;border-radius:28px;background:#15161b;display:flex;align-items:center;justify-content:center}.menuBtn{width:74px}.menuIcon{font-size:30px;line-height:1}.cartPill{justify-self:end;width:86px;gap:10px}.cartQty{font-size:19px}.cartIcon{font-size:24px}
.notice{height:56px;display:flex;align-items:center;justify-content:center;text-align:center;padding:0 18px;border-bottom:1px solid #202127;background:#121318;color:#eee;font-size:15px}.notice b{text-decoration:underline}
.stage{position:relative;overflow:hidden;min-height:0}.screen{position:absolute;inset:0;display:none;flex-direction:column;background:var(--bg)}.screen.active{display:flex}.screen.scroll{overflow-y:auto}
.product-title{letter-spacing:4px;text-align:center;margin:clamp(10px,2vh,22px) 0 4px;font-size:16px;flex:0 0 auto}.heroArea{flex:1;display:flex;align-items:center;justify-content:center;min-height:0;overflow:hidden;padding:4px 0}.shirtWrap{position:relative;width:min(66vw,48vh,500px);aspect-ratio:.82;display:flex;align-items:center;justify-content:center;max-height:100%}.shirtSvg{width:100%;height:100%;filter:drop-shadow(0 14px 24px rgba(0,0,0,.22))}.viewDots{display:flex;align-items:center;justify-content:center;gap:12px;margin:2px 0 10px;flex:0 0 auto}.dotView{width:52px;height:52px;border:1px solid #06070a;border-radius:50%;display:grid;place-items:center;background:#14151a;color:#777;font-size:24px}.dotView.active{border:1px solid #fff;color:#fff}.primary{border:none;background:var(--blue);border-radius:28px;padding:12px 28px;font-size:17px;letter-spacing:3px;min-width:235px}.homeBottom{display:flex;justify-content:center;padding:0 20px max(12px,env(safe-area-inset-bottom));flex:0 0 auto}
.editorHeader{height:48px;display:grid;grid-template-columns:1fr 64px;align-items:center;background:#1b1c22;border-bottom:1px solid #090a0e;padding-left:22px;letter-spacing:4px}.editorCanvas{position:relative;flex:1;min-height:0;background:#000;display:flex;align-items:center;justify-content:center;overflow:hidden}.editorCanvas .shirtWrap{width:min(76vw,56vh,620px);height:auto;max-height:100%;aspect-ratio:.82}.printArea{position:absolute;left:50%;top:49%;width:46%;height:44%;transform:translate(-50%,-50%);overflow:visible;touch-action:none}.art{position:absolute;left:50%;top:46%;width:72%;transform:translate(-50%,-50%);transform-origin:center center;user-select:none;touch-action:none;cursor:move}.art img{width:100%;display:block;pointer-events:none}.art.selected{outline:1px dashed rgba(255,255,255,.75)}.deleteArt{position:absolute;left:-12px;top:-12px;width:24px;height:24px;border-radius:50%;border:none;background:var(--danger);display:none}.art.selected .deleteArt{display:block}.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;color:#aaa;background:#111b;padding:7px 10px;border-radius:14px;white-space:nowrap}
.zoomStrip{height:44px;display:flex;justify-content:flex-end;background:#1a1b20;border-top:1px solid #050507}.iconBtn{width:64px;border:0;border-left:1px solid #090a0e;background:#18191f;font-size:24px}.tools{display:grid;grid-template-columns:repeat(5,1fr);height:66px;background:#1a1b20;border-top:1px solid #08090c}.tool{border:0;border-right:1px solid #090a0e;background:#18191f;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;font-size:11px;color:#ddd}.tool .ico{font-size:23px}.editorNav{display:grid;grid-template-columns:1fr 1fr;height:54px;border-top:1px solid #090a0e}.editorNav button{border:0;background:#18191f;letter-spacing:2px;font-size:15px}.editorNav .next{color:#fff}.editorNav .next:disabled{color:#747782}
.modalShade{position:absolute;inset:0;background:#0009;z-index:40;display:none;align-items:center;justify-content:center;padding:24px}.modalShade.show{display:flex}.sheet{width:min(92vw,460px);background:#1e1f25;border:1px solid #30313a;border-radius:22px;overflow:hidden;box-shadow:0 26px 70px #0009}.sheetTitle{padding:18px 20px;font-size:18px;font-weight:700;border-bottom:1px solid #30313a}.sheetRow{width:100%;padding:18px 20px;text-align:left;border:0;border-bottom:1px solid #30313a;background:#1e1f25;font-size:17px}.sheetRow:last-child{border-bottom:0}.closeSheet{float:right;border:0;background:transparent;font-size:21px}
.colorPanel{position:absolute;right:18px;bottom:120px;width:108px;padding:10px;background:#191a20;border:1px solid #06070a;border-radius:12px;display:none;grid-template-columns:repeat(2,1fr);gap:9px;z-index:22}.colorPanel.show{display:grid}.swatch{aspect-ratio:1;border-radius:50%;border:1px solid #050507}.textPanel{padding:18px}.textPanel input{width:100%;padding:14px;border-radius:12px;border:1px solid #3a3c46;background:#111217;color:#fff;font-size:18px}.textPanel button{margin-top:14px;width:100%}
.checkout{overflow:hidden;padding:8px 0 max(8px,env(safe-area-inset-bottom));min-height:0}.checkout.active{display:flex;flex-direction:column}.checkoutPreview{padding:4px 16px 2px;display:flex;justify-content:center;align-items:center;gap:0;flex:1 1 auto;min-height:0;overflow:hidden}.miniShirt{position:relative;width:min(34vw,31vh,330px);aspect-ratio:.82;max-height:100%}.miniBack{width:min(23vw,21vh,220px);margin-left:-4%}.miniArt{position:absolute;left:50%;top:44%;width:46%;transform:translate(-50%,-50%);max-height:40%;object-fit:contain}.checkoutControls{display:grid;grid-template-columns:1fr auto;gap:10px;max-width:760px;width:94%;margin:0 auto;flex:0 0 auto}.sizes{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}.sizeBox{border:1px solid #0a0a0c;background:#191a20;text-align:center;padding:6px 4px;border-radius:3px;min-width:48px}.sizeBox .plus{display:block;border-top:1px dashed #30313a;margin-top:7px;padding-top:5px}.sizeBox.selected{outline:2px solid var(--blue)}.checkoutColor{display:grid;grid-template-columns:repeat(2,34px);gap:7px;background:#18191f;padding:8px;border:1px solid #08090c;border-radius:10px}.summary{margin-top:8px;border-top:1px solid #292b33;border-bottom:1px solid #292b33;padding:10px 20px;color:var(--muted);text-align:center}.totals{padding:10px 20px 4px;flex:0 0 auto}.row{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.qtyBox,.totalBox{border:1px solid #06070a;border-radius:30px;background:#16171c;padding:10px 22px}.totalBox{flex:1;margin-left:14px;text-align:center}.checkoutBtns{display:grid;grid-template-columns:1fr 2fr;gap:14px}.checkoutBtns button{height:44px;border-radius:26px;border:1px solid #07080a;background:#18191f}.checkoutBtns .cartBtn{background:#3156b9;border:0;letter-spacing:2px}.footerNote{text-align:center;color:#666;font-size:11px;margin-top:6px}
.toast{position:absolute;left:50%;bottom:20px;transform:translateX(-50%) translateY(30px);opacity:0;background:#fff;color:#111;padding:10px 16px;border-radius:20px;z-index:100;transition:.2s}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.topbar{height:58px;grid-template-columns:62px 1fr 72px;padding:0 8px}.brand{font-size:24px}.pill{height:40px}.menuBtn{width:58px}.cartPill{width:68px}.notice{height:40px;font-size:11px;padding:0 10px}.product-title{margin-top:8px;font-size:13px}.shirtWrap{width:min(78vw,46vh,430px)}.viewDots{margin-bottom:7px}.dotView{width:44px;height:44px;font-size:20px}.primary{padding:10px 22px;font-size:15px;min-width:210px}.editorHeader{height:42px;font-size:12px;padding-left:14px}.editorCanvas .shirtWrap{width:min(88vw,51vh,500px)}.zoomStrip{height:38px}.iconBtn{width:54px;font-size:20px}.tools{height:58px}.tool{font-size:8px;gap:4px}.tool .ico{font-size:19px}.editorNav{height:48px}.editorNav button{font-size:13px}.hint{font-size:9px;bottom:4px;padding:5px 8px}.checkout{padding-top:3px}.checkoutPreview{padding:2px 8px 0}.miniShirt{width:min(45vw,27vh,280px)}.miniBack{display:block;width:min(27vw,17vh,170px)}.checkoutControls{grid-template-columns:1fr auto;gap:6px;width:96%}.sizes{grid-template-columns:repeat(6,1fr);gap:3px}.sizeBox{min-width:0;padding:5px 2px;font-size:11px}.sizeBox .plus{margin-top:4px;padding-top:3px}.checkoutColor{grid-template-columns:repeat(2,26px);gap:5px;padding:5px}.summary{margin-top:5px;padding:7px 10px;font-size:11px}.totals{padding:7px 10px 2px}.row{margin-bottom:6px}.qtyBox,.totalBox{padding:8px 12px;font-size:12px}.checkoutBtns{grid-template-columns:1fr 2fr;gap:8px}.checkoutBtns button{height:40px;font-size:12px}.footerNote{display:none}}
@media(max-height:760px){.topbar{height:54px}.notice{height:36px}.product-title{margin-top:6px}.shirtWrap{width:min(64vw,41vh,410px)}.viewDots{margin-bottom:5px}.dotView{width:42px;height:42px}.homeBottom{padding-bottom:8px}.editorHeader{height:38px}.editorCanvas .shirtWrap{width:min(72vw,44vh,460px)}.zoomStrip{height:34px}.tools{height:52px}.editorNav{height:44px}.checkoutPreview{padding-top:0}.miniShirt{width:min(32vw,24vh,240px)}.miniBack{width:min(21vw,16vh,150px)}.summary{padding:6px}.totals{padding-top:5px}.checkoutBtns button{height:38px}}
</style>
</head>
<body>
<div class="app">
  <header class="topbar"><button class="pill menuBtn" id="menuBtn"><span class="menuIcon">☰</span></button><div class="brand">shirt<span style="font-size:.45em;letter-spacing:0">.app</span></div><button class="pill cartPill" id="cartTop"><span class="cartQty" id="cartQty">0</span><span class="cartIcon">🛒</span></button></header>
  <div class="notice">Design your own shirt directly in your browser.</div>
  <main class="stage">
    <section class="screen active" id="homeScreen">
      <div class="product-title">CLASSIC TEE</div>
      <div class="heroArea"><div class="shirtWrap" id="homeShirt"></div></div>
      <div class="viewDots"><button class="dotView active">👕</button><button class="dotView">◻</button><button class="dotView">◻</button></div>
      <div class="homeBottom"><button class="primary" id="customizeBtn">CUSTOMIZE</button></div>
    </section>

    <section class="screen" id="editorScreen">
      <div class="editorHeader"><div>CLASSIC TEE · <span id="sideLabel">FRONT</span></div><button class="iconBtn" id="moreBtn">•••</button></div>
      <div class="editorCanvas" id="editorCanvas">
        <div class="shirtWrap" id="editorShirt"></div>
        <div class="printArea" id="printArea"></div>
        <div class="hint">Drag artwork • pinch/slider to resize • double tap to center</div>
      </div>
      <div class="zoomStrip"><button class="iconBtn" id="zoomOut">−</button><button class="iconBtn" id="zoomIn">＋</button><button class="iconBtn" id="rotateBtn">↻</button></div>
      <div class="tools">
        <button class="tool" id="colorTool"><span class="ico">◉</span><span>CHANGE COLOR</span></button>
        <button class="tool" id="imageTool"><span class="ico">▣</span><span>ADD IMAGE</span></button>
        <button class="tool" id="stickerTool"><span class="ico">☻</span><span>ADD STICKER</span></button>
        <button class="tool" id="emojiTool"><span class="ico">☺</span><span>ADD EMOJI</span></button>
        <button class="tool" id="textTool"><span class="ico">✎</span><span>ADD TEXT</span></button>
      </div>
      <div class="editorNav"><button id="backHome">BACK</button><button class="next" id="toCheckout">NEXT</button></div>
      <div class="colorPanel" id="colorPanel"></div>
      <input type="file" accept="image/*" id="imageInput" hidden />
    </section>

    <section class="screen checkout" id="checkoutScreen">
      <div class="checkoutPreview"><div class="miniShirt" id="checkoutFront"></div><div class="miniShirt miniBack" id="checkoutBack"></div></div>
      <div class="checkoutControls">
        <div class="sizes" id="sizes"></div>
        <div class="checkoutColor" id="checkoutColors"></div>
      </div>
      <div class="summary" id="sizeSummary">NO SIZES SELECTED</div>
      <div class="totals"><div class="row"><div class="qtyBox">QTY&nbsp;&nbsp; <b id="qty">0</b></div><div class="totalBox">TOTAL&nbsp;&nbsp; <b id="total">$0.00</b></div></div><div class="checkoutBtns"><button id="cancelCheckout">CANCEL</button><button class="cartBtn" id="addCart">ADD TO CART</button></div><div class="footerNote">Prototype checkout — no payment is processed.</div></div>
    </section>

    <div class="modalShade" id="menuModal"><div class="sheet"><div class="sheetTitle">Menu <button class="closeSheet" data-close="menuModal">✕</button></div><button class="sheetRow" data-go="homeScreen">Product</button><button class="sheetRow" data-go="editorScreen">Designer</button><button class="sheetRow" data-go="checkoutScreen">Checkout</button></div></div>
    <div class="modalShade" id="addModal"><div class="sheet"><div class="sheetTitle">Add image <button class="closeSheet" data-close="addModal">✕</button></div><button class="sheetRow" id="chooseFile">Choose File</button><button class="sheetRow" id="takePhoto">Take Photo</button><button class="sheetRow" id="photoLibrary">Photo Library</button></div></div>
    <div class="modalShade" id="textModal"><div class="sheet"><div class="sheetTitle">Add text <button class="closeSheet" data-close="textModal">✕</button></div><div class="textPanel"><input id="textInput" placeholder="Type your text" maxlength="40"/><button class="primary" id="addTextBtn">ADD TEXT</button></div></div></div>
    <div class="toast" id="toast"></div>
  </main>
</div>
<script>
const state={screen:'homeScreen',side:'front',color:'#f7f7f7',artFront:[],artBack:[],selected:null,qty:0,cart:0};
const colors=['#d19a2f','#44474c','#8b8f94','#cc5127','#f7f7f7','#4c267d','#d52f34','#050505'];
const sizes=['S','M','L','XL','2XL','3XL'];
function shirtSVG(color=state.color){return `<svg class="shirtSvg" viewBox="0 0 500 620" aria-label="T-shirt mockup"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff" stop-opacity=".52"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".12"/></linearGradient></defs><path d="M160 70 205 45c20 18 70 18 90 0l45 25c54 10 83 36 104 82l-60 39-20-33v390c-70 20-158 20-228 0V158l-20 33-60-39c21-46 50-72 104-82Z" fill="${color}" stroke="#d7d7d7" stroke-width="2"/><path d="M205 45c5 34 85 34 90 0l16 9c-18 55-104 55-122 0l16-9Z" fill="${color}" stroke="#ddd" stroke-width="2"/><path d="M160 70 205 45c20 18 70 18 90 0l45 25c54 10 83 36 104 82l-60 39-20-33v390c-70 20-158 20-228 0V158l-20 33-60-39c21-46 50-72 104-82Z" fill="url(#g)" opacity=".7"/></svg>`}
function renderShirts(){homeShirt.innerHTML=shirtSVG();editorShirt.innerHTML=shirtSVG();checkoutFront.innerHTML=shirtSVG();checkoutBack.innerHTML=shirtSVG();renderCheckoutArt();}
function showScreen(id){document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');state.screen=id;document.querySelectorAll('.modalShade').forEach(m=>m.classList.remove('show'));if(id==='checkoutScreen')renderCheckout();}
function currentArts(){return state.side==='front'?state.artFront:state.artBack}
function renderArts(){printArea.innerHTML='';currentArts().forEach(a=>{const el=document.createElement('div');el.className='art'+(state.selected===a.id?' selected':'');el.dataset.id=a.id;el.style.left=a.x+'%';el.style.top=a.y+'%';el.style.width=a.w+'%';el.style.transform=`translate(-50%,-50%) rotate(${a.r||0}deg)`; if(a.type==='image'){el.innerHTML=`<button class="deleteArt">×</button><img src="${a.src}">`}else{el.innerHTML=`<button class="deleteArt">×</button><div style="font-size:${a.fs||28}px;font-weight:800;text-align:center;color:${a.color||'#111'};text-shadow:0 1px 1px #fff8">${escapeHtml(a.text)}</div>`}printArea.appendChild(el)});bindArtGestures();}
function escapeHtml(s){return s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function addImage(src){const a={id:crypto.randomUUID(),type:'image',src,x:50,y:46,w:72,r:0};currentArts().push(a);state.selected=a.id;renderArts();toast('Image added');}
function addText(text){const a={id:crypto.randomUUID(),type:'text',text,x:50,y:46,w:70,r:0,fs:28,color:'#111'};currentArts().push(a);state.selected=a.id;renderArts();}
function selectedArt(){return currentArts().find(a=>a.id===state.selected)}
function adjustSelected(delta){const a=selectedArt();if(!a)return toast('Select artwork first');a.w=Math.max(18,Math.min(120,a.w+delta));renderArts()}
function rotateSelected(){const a=selectedArt();if(!a)return toast('Select artwork first');a.r=(a.r+15)%360;renderArts()}
function bindArtGestures(){document.querySelectorAll('.art').forEach(el=>{el.addEventListener('pointerdown',e=>{if(e.target.classList.contains('deleteArt'))return;state.selected=el.dataset.id;renderArts();const a=selectedArt();const rect=printArea.getBoundingClientRect();const start={x:e.clientX,y:e.clientY,ax:a.x,ay:a.y};function move(ev){a.x=Math.max(0,Math.min(100,start.ax+(ev.clientX-start.x)/rect.width*100));a.y=Math.max(0,Math.min(100,start.ay+(ev.clientY-start.y)/rect.height*100));renderArts()}function up(){window.removeEventListener('pointermove',move);window.removeEventListener('pointerup',up)}window.addEventListener('pointermove',move);window.addEventListener('pointerup',up)},{once:true});el.addEventListener('dblclick',()=>{const a=currentArts().find(x=>x.id===el.dataset.id);a.x=50;a.y=46;renderArts()});el.querySelector('.deleteArt').onclick=(e)=>{e.stopPropagation();const id=el.dataset.id;const arr=currentArts();arr.splice(arr.findIndex(x=>x.id===id),1);state.selected=null;renderArts()}})}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(t._tm);t._tm=setTimeout(()=>t.classList.remove('show'),1600)}
function openUpload(mode='files'){imageInput.removeAttribute('capture');if(mode==='camera')imageInput.setAttribute('capture','environment');imageInput.click()}
function renderCheckoutArt(){document.querySelectorAll('.miniArt').forEach(x=>x.remove());const first=state.artFront.find(a=>a.type==='image');if(first){const img=document.createElement('img');img.className='miniArt';img.src=first.src;checkoutFront.appendChild(img)} }
function renderCheckout(){renderShirts();document.getElementById('sizeSummary').textContent=state.qty?`${state.qty} ITEM${state.qty>1?'S':''} SELECTED`:'NO SIZES SELECTED';qty.textContent=state.qty;total.textContent='$'+(state.qty*24.99).toFixed(2);cartQty.textContent=state.cart;}
customizeBtn.onclick=()=>showScreen('editorScreen');backHome.onclick=()=>showScreen('homeScreen');toCheckout.onclick=()=>showScreen('checkoutScreen');cancelCheckout.onclick=()=>showScreen('editorScreen');cartTop.onclick=()=>showScreen('checkoutScreen');menuBtn.onclick=()=>menuModal.classList.add('show');
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).classList.remove('show'));document.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>showScreen(b.dataset.go));
imageTool.onclick=()=>addModal.classList.add('show');chooseFile.onclick=()=>openUpload();photoLibrary.onclick=()=>openUpload();takePhoto.onclick=()=>openUpload('camera');imageInput.onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{addModal.classList.remove('show');addImage(r.result)};r.readAsDataURL(f);e.target.value=''};
colorTool.onclick=()=>colorPanel.classList.toggle('show');colors.forEach(c=>{const b=document.createElement('button');b.className='swatch';b.style.background=c;b.onclick=()=>{state.color=c;renderShirts();colorPanel.classList.remove('show')};colorPanel.appendChild(b);const c2=b.cloneNode();c2.onclick=()=>{state.color=c;renderShirts()};checkoutColors.appendChild(c2)});
textTool.onclick=()=>textModal.classList.add('show');addTextBtn.onclick=()=>{const v=textInput.value.trim();if(!v)return;addText(v);textInput.value='';textModal.classList.remove('show')};
stickerTool.onclick=()=>addText('★');emojiTool.onclick=()=>addText('☺');zoomIn.onclick=()=>adjustSelected(8);zoomOut.onclick=()=>adjustSelected(-8);rotateBtn.onclick=rotateSelected;moreBtn.onclick=()=>{state.side=state.side==='front'?'back':'front';sideLabel.textContent=state.side.toUpperCase();state.selected=null;renderArts();toast(`${state.side.toUpperCase()} side`)};
sizes.forEach(s=>{const b=document.createElement('button');b.className='sizeBox';b.innerHTML=`${s}<span class="plus">＋</span>`;b.onclick=()=>{b.classList.toggle('selected');state.qty=document.querySelectorAll('.sizeBox.selected').length;renderCheckout()};document.getElementById('sizes').appendChild(b)});
addCart.onclick=()=>{if(!state.qty)return toast('Select at least one size');state.cart+=state.qty;cartQty.textContent=state.cart;toast(`${state.qty} item${state.qty>1?'s':''} added to cart`)};
window.addEventListener('keydown',e=>{if(e.key==='Escape')document.querySelectorAll('.modalShade').forEach(m=>m.classList.remove('show'))});
renderShirts();renderArts();renderCheckout();
</script>
</body>
</html>
